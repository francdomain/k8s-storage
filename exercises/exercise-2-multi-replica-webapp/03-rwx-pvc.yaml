apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  namespace: exercise-2
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /exports
    server: nfs-service.exercise-2.svc.cluster.local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-web-pvc
  namespace: exercise-2
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
  volumeName: nfs-pv