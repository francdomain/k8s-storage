apiVersion: v1
kind: Namespace
metadata:
  name: exercise-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: exercise-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-storage-lab-server-0
      containers:
      - name: nfs-server
        image: itsthenetwork/nfs-server-alpine:latest
        securityContext:
          privileged: true
        env:
        - name: SHARED_DIRECTORY
          value: "/exports"
        volumeMounts:
        - name: exports
          mountPath: /exports
        ports:
        - containerPort: 2049
          name: nfs
        - containerPort: 111
          name: rpcbind
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - rpcinfo -p localhost 2>&1 | grep -E "2049|nfs"
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: exports
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-service
  namespace: exercise-2
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
  - name: nfs
    port: 2049
    targetPort: 2049
  - name: rpcbind
    port: 111
    targetPort: 111