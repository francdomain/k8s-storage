apiVersion: v1
kind: Namespace
metadata:
  name: exercise-3
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retain-policy-sc
provisioner: rancher.io/local-path
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: delete-policy-sc
provisioner: rancher.io/local-path
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-policy-pvc
  namespace: exercise-3
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: retain-policy-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delete-policy-pvc
  namespace: exercise-3
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: delete-policy-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-retain-pod
  namespace: exercise-3
spec:
  containers:
  - name: test
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Testing retain policy storage..."
      echo "Writing test data to /data"
      dd if=/dev/zero of=/data/testfile-retain.bin bs=1M count=10 status=none 2>&1
      echo "✅ Data written ($(date))"
      echo "Keeping container running..."
      tail -f /dev/null
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: retain-policy-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: test-delete-pod
  namespace: exercise-3
spec:
  containers:
  - name: test
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Testing delete policy storage..."
      echo "Writing test data to /data"
      dd if=/dev/zero of=/data/testfile-delete.bin bs=1M count=10 status=none 2>&1
      echo "✅ Data written ($(date))"
      echo "Keeping container running..."
      tail -f /dev/null
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: delete-policy-pvc
